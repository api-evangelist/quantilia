aid: quantilia
name: Quantilia
description: 'Quantilia is a Nice, France based financial data and portfolio reporting
  platform for institutional investors, family offices, asset managers, private banks,
  insurance companies and corporates and endowments. It aggregates fragmented investment
  data from custodian banks, fund administrators, fund managers, private equity and
  real estate GPs, ESG score providers and benchmark vendors such as MSCI and Bloomberg,
  then extracts, tests, categorizes, standardizes, labels, enriches and controls it
  into a single auditable reporting layer with full financial data lineage. Products
  cover tailored portfolio monitoring, multi-source data aggregation, security-level
  and private equity lookthrough, structured products monitoring, ESG and risk reports,
  quantitative analysis, document generation and AI services, with regulatory output
  for Solvency II, QRT, COREP, CRR3, SFDR, PAI and LEC29. Delivery is via dashboards,
  report packs, Excel, PDF and API feeds. The company states ISO-27001 certification,
  GDPR and DORA compliance, and EU/Swiss based hosting. No public developer portal,
  API reference or machine-readable specification is published; the API surface is
  delivered to contracted clients.'

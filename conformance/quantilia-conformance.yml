note: >-
  Quantilia publishes no machine-readable API contract, so no API-technical
  conformance (OpenAPI, OAuth 2.0, OIDC, RFC 9457, pagination, idempotency) can be
  asserted or refuted from a spec. What it does publish, on its own homepage, is a
  security and regulatory posture — an ISO-27001 certification claim, GDPR and DORA
  compliance, and EU/Swiss data residency — plus the regulatory report formats its
  platform produces for clients. Those are recorded below with the page they were
  read from. Certification claims are the provider's own statements; API Evangelist
  has not seen a certificate, an auditor's report, or a trust center (probed for and
  not found — see security/quantilia-trust-center.yml absence).
